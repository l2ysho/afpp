version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
  - package-ecosystem: 'docker'
    directories:
      - '/benchmark/*'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: 'node'
        versions: ['~> 27.0', '~> 29.0', '~> 31.0', '~> 33.0']
