name: Mutation testing

on:
  pull_request:
    branches:
      - main
      - beta
    paths:
      - 'src/**'
      - 'test/**'
      - 'stryker.config.mjs'
      - 'package.json'
  schedule:
    # Monday 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:

# The incremental file lets a pull request test only the mutants its diff
# touches. The scheduled run rebuilds the file from scratch and saves the cache
# that the pull request runs read. On a cache miss the pull request simply runs
# every mutant, which is slow but correct.
env:
  CACHE_KEY_PREFIX: stryker-incremental-main-

jobs:
  incremental:
    name: Incremental (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 'lts/*'
      - name: Enable corepack
        run: corepack enable
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore the incremental file
        uses: actions/cache/restore@v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: ${{ env.CACHE_KEY_PREFIX }}
          restore-keys: ${{ env.CACHE_KEY_PREFIX }}
      - name: Run mutation tests
        run: pnpm test:mutation --incremental
      - name: Write job summary
        if: always()
        run: |
          report=reports/mutation/mutation.json
          if [ -f "$report" ]; then
            node .github/scripts/mutation-summary.mjs "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 14

  full:
    name: Full (scheduled)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 'lts/*'
      - name: Enable corepack
        run: corepack enable
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run mutation tests
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        # The dashboard reporter fails the run without an API key, so only add it
        # once the secret is set.
        run: |
          reporters=html,clear-text,progress,json
          if [ -n "$STRYKER_DASHBOARD_API_KEY" ]; then
            reporters="$reporters,dashboard"
          fi
          pnpm test:mutation --incremental --force --reporters "$reporters"
      - name: Write job summary
        if: always()
        run: |
          report=reports/mutation/mutation.json
          if [ -f "$report" ]; then
            node .github/scripts/mutation-summary.mjs "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 30
      - name: Save the incremental file
        uses: actions/cache/save@v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: ${{ env.CACHE_KEY_PREFIX }}${{ github.run_id }}
